[vars]
machine = "macos"

[dotfiles]
"~/.config/mise/mise.macos.toml" = { source = "~/.dotfiles/mise.macos.toml", mode = "symlink" }
"~/.config/ghostty" = { source = "~/.dotfiles/home/config/ghostty", mode = "symlink-each" }
"~/.config/k9s" = { source = "~/.dotfiles/home/config/k9s", mode = "symlink-each" }
"~/.config/fish" = { source = "~/.dotfiles/home/config/fish", mode = "symlink-each" }
"~/.config/homebrew" = { source = "~/.dotfiles/home/macos/homebrew", mode = "symlink" }
"~/.config/fish/conf.d/10-homebrew.fish" = { source = "~/.dotfiles/home/macos/10-homebrew.fish", mode = "symlink" }

# Runs after the dotfiles phase so the brewfile symlink exists on first run.
[bootstrap.hooks.post-dotfiles]
run = "brew bundle --no-upgrade --file=$HOME/.config/homebrew/Brewfile"

[tools]
rust = "stable"
